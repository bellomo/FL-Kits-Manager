# Tests on every push and pull request; the Windows exe (PyInstaller, one folder) on every push to main and on tags.
# A tag vX.Y.Z must match the version of flkm/__init__.py: it publishes FLKitsManager_vX.Y.Z.zip as a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Tests (100% line and branch coverage, ruff)
        run: python -m pytest -q --cov=flkm --cov-report=term-missing

  exe:
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import flkm; print(flkm.__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "tag ${{ github.ref_name }} does not match version $v"
          }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Build (one folder)
        run: pyinstaller --noconfirm --clean --windowed --onedir --name FLKitsManager --paths . flkm/__main__.py
      - name: Smoke test of the exe
        shell: pwsh
        run: |
          $p = Start-Process dist/FLKitsManager/FLKitsManager.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: exit code $($p.ExitCode)" }
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md, CHANGELOG.md dist/FLKitsManager/
          Compress-Archive -Path dist/FLKitsManager -DestinationPath FLKitsManager_v${{ steps.version.outputs.value }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FLKitsManager_v${{ steps.version.outputs.value }}
          path: FLKitsManager_v${{ steps.version.outputs.value }}.zip
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} FLKitsManager_v${{ steps.version.outputs.value }}.zip --title "FL Kits Manager ${{ github.ref_name }}" --notes-file CHANGELOG.md
