# Tests on every push and pull request (free on public repositories). The Windows exe (PyInstaller, one folder) is
# built only for a release: a tag vX.Y.Z pushed on the commit we choose. The tag must match the version of
# flkm/__init__.py; it publishes FLKitsManager_vX.Y.Z.zip as a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Tests (100% line and branch coverage, ruff)
        run: python -m pytest -q --cov=flkm --cov-report=term-missing

  exe:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import flkm; print(flkm.__version__)"
          if ("${{ github.ref_name }}" -ne "v$v") {
            throw "tag ${{ github.ref_name }} does not match version $v"
          }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Build and smoke test (one folder, same script as the local build)
        shell: pwsh
        run: ./scripts/build.ps1 -Python python
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md, CHANGELOG.md, LICENSE dist/FLKitsManager/
          Compress-Archive -Path dist/FLKitsManager -DestinationPath FLKitsManager_v${{ steps.version.outputs.value }}.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} FLKitsManager_v${{ steps.version.outputs.value }}.zip --title "FL Kits Manager ${{ github.ref_name }}" --notes-file CHANGELOG.md
