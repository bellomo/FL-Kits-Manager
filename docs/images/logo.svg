<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="FL Kits Manager logo: a white football shirt wrapped in a flowing rainbow drape, after Iris, goddess of the rainbow, and a football with the wings of her sandals, inside a rainbow ring on a sky disc">
